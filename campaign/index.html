  <script>
    'use strict';
    const records = JSON.parse(document.getElementById('data').textContent);
    const channels = {email:'Почта',telegram:'Telegram',whatsapp:'WhatsApp',max:'MAX',vk:'ВКонтакте',phone:'Телефон',form:'Форма на сайте'};
    const storeKey = 'clientspace-sauna-campaign-sent-v1';
    let sent = {};
    try { sent = JSON.parse(localStorage.getItem(storeKey) || '{}'); } catch {}
    const find = id => document.getElementById(id);
    const list = find('list');
    const search = find('search');
    const channel = find('channel');
    const sentFilter = find('sent-filter');
    const items = [];
    for (const [key,name] of Object.entries(channels)) {
      if (records.some(record => record.contacts.some(contact => contact.channel === key))) channel.add(new Option(name,key));
    }
    function node(tag, className, label) {
      const element = document.createElement(tag);
      if (className) element.className = className;
      if (label) element.textContent = label;
      return element;
    }
    function link(url, label, className) {
      const result = node('a',className,label);
      result.href = url;
      if (!url.startsWith('tel:') && !url.startsWith('mailto:')) {
        result.target = '_blank';
        result.rel = 'noopener noreferrer';
      }
      return result;
    }
    function copy(label, text) {
      const button = node('button','button',label);
      button.type = 'button';
      button.addEventListener('click', async () => {
        try {
          await navigator.clipboard.writeText(typeof text === 'function' ? text() : text);
          button.textContent = 'Скопировано';
        } catch {
          const field = node('textarea');
          field.value = typeof text === 'function' ? text() : text;
          button.after(field);
          field.select();
          if (document.execCommand('copy')) {
            field.remove();
            button.textContent = 'Скопировано';
          }
        }
        setTimeout(() => { button.textContent = label; }, 1600);
      });
      return button;
    }
    function render(record) {
      const item = node('article','record');
      const head = node('div','record-head');
      const name = node('div');
      name.append(node('h2','',record.name),node('p','',record.address));
      const status = record.href ? 'GitHub Pages' : record.status === 'building' ? 'Публикуется' : record.local ? 'Локальное демо' : 'В подготовке';
      head.append(name,node('span','state'+(record.href?' ready':''),status));
      const actions = node('div','actions');
      if (record.href) actions.append(link(record.href,'Открыть опубликованное демо ↗','button primary'),copy('Скопировать ссылку',record.href));
      else if (record.local) actions.append(link(`demos/${record.slug}/index.html`,'Открыть локальное демо ↗','button primary'));
      actions.append(link(record.source,'Исходный сайт ↗','button'));
      if (record.repo) actions.append(link(record.repo,'Репозиторий ↗','button'));
      const contacts = node('div','contacts');
      for (const contact of record.contacts) {
        const action = link(contact.href,contact.label,'contact '+contact.channel);
        if (channels[contact.channel] !== contact.label) action.prepend(node('small','',channels[contact.channel]));
        contacts.append(action);
      }
      if (!record.contacts.length) contacts.append(node('span','muted','Публичный контакт для связи уточняется'));
      else if (record.contacts.every(contact => contact.channel === 'phone')) contacts.append(node('span','muted','Письменный канал не подтверждён'));
      const details = node('details');
      details.append(node('summary','','Текст письма'));
      const email = node('div','email');
      let sender = 'Антон';
      const body = node('pre','',record.messages[sender]);
      const controls = node('div','senders');
      controls.setAttribute('role','group');
      controls.setAttribute('aria-label','Отправитель письма');
      controls.append(node('span','','Отправитель'));
      const senderButtons = [];
      let compose;
      const mailbox = record.contacts.find(contact => contact.channel === 'email');
      const composeUrl = () => 'https://e.mail.ru/compose/?' + new URLSearchParams({
        to:mailbox.href.slice(7),subject:record.subject,body:record.messages[sender],
      }).toString();
      for (const option of Object.keys(record.messages)) {
        const button = node('button','button',option);
        button.type = 'button';
        button.setAttribute('aria-pressed',String(option === sender));
        button.addEventListener('click',() => {
          sender = option;
          body.textContent = record.messages[sender];
          for (const choice of senderButtons) choice.setAttribute('aria-pressed',String(choice === button));
          if (compose) compose.href = composeUrl();
        });
        senderButtons.push(button);
        controls.append(button);
      }
      email.append(controls,node('h3','',record.subject),body);
      const mailActions = node('div','actions');
      if (record.href) {
        mailActions.append(copy('Скопировать письмо',() => record.messages[sender]),copy('Скопировать тему',record.subject));
        if (mailbox) {
          compose = link(composeUrl(),'Открыть черновик в Mail.ru ↗','button');
          mailActions.append(compose);
        }
      }
      const sentControl = node('label','sent');
      const checkbox = node('input');
      checkbox.type = 'checkbox';
      checkbox.checked = Boolean(sent[record.slug]);
      checkbox.addEventListener('change',() => {
        sent[record.slug] = checkbox.checked;
        try { localStorage.setItem(storeKey,JSON.stringify(sent)); } catch {}
        sentControl.lastChild.textContent = checkbox.checked ? 'Написал' : 'Не написал';
        filter();
      });
      sentControl.append(checkbox,node('span','',checkbox.checked ? 'Написал' : 'Не написал'));
      actions.append(sentControl);
      email.append(mailActions);
      details.append(email);
      item.append(head,actions,contacts);
      for (const note of record.notes || []) item.append(node('p','note',note));
      item.append(details);
      list.append(item);
      items.push([record,item]);
    }
    function filter() {
      const query = search.value.toLocaleLowerCase('ru').trim();
      let visible = 0;
      for (const [record,item] of items) {
        const text = `${record.name} ${record.address}`.toLocaleLowerCase('ru');
        item.hidden = !text.includes(query)
          || Boolean(channel.value && !record.contacts.some(contact => contact.channel === channel.value))
          || Boolean(sentFilter.value && (sentFilter.value === 'sent') !== Boolean(sent[record.slug]));
        if (!item.hidden) visible++;
      }
      find('count').textContent = `Показано ${visible} из ${records.length} · опубликовано ${records.filter(record => record.href).length}`;
      find('empty').hidden = visible > 0;
    }
    records.forEach(render);
    const empty = node('div','empty','По этим фильтрам саун нет.');
    empty.id = 'empty';
    list.append(empty);
    search.addEventListener('input',filter);
    channel.addEventListener('change',filter);
    sentFilter.addEventListener('change',filter);
    filter();
  </script>
